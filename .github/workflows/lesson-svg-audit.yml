name: Lesson SVG theme audit

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: ["main"]
    paths:
      - "lessons/**/*.html"
      - "styles/lesson-design-system.css"
      - "styles/lesson-reference-111.css"
      - "tests/test_svg_theme_fallback.py"
      - ".github/workflows/lesson-svg-audit.yml"
  pull_request:
    paths:
      - "lessons/**/*.html"
      - "styles/lesson-design-system.css"
      - "styles/lesson-reference-111.css"
      - "tests/test_svg_theme_fallback.py"
      - ".github/workflows/lesson-svg-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-svg-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit theme-aware SVGs in all lessons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete lesson SVG theme audit
        run: python -m unittest discover -s tests -p "test_svg_theme_fallback.py" -v
