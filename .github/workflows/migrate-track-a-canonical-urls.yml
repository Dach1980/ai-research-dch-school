name: Preview Track A canonical lesson URL migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preview migration in disposable checkout
        run: |
          python scripts/migrate_track_a_canonical_urls.py
          git status --short
          git diff --stat
          git diff --binary > /tmp/track-a-migration.patch
      - uses: actions/upload-artifact@v4
        with:
          name: track-a-migration-preview
          path: /tmp/track-a-migration.patch
