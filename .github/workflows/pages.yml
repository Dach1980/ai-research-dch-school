name: Deploy static website to GitHub Pages
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dch-school-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate-catalog:
    uses: ./.github/workflows/validate-catalog.yml
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-catalog.txt
      - name: Run Lesson Quality Gate v1 structural checks
        run: python scripts/lesson_quality_gate.py
      - name: Install Playwright Chromium for canonical lesson UI acceptance
        run: |
          python -m pip install playwright==1.65.0
          python -m playwright install --with-deps chromium
      - name: Test canonical lesson UI contract
        run: python -m unittest discover -s tests -p 'test_canonical_lesson_ui_contract.py' -v
      - name: Test canonical lesson browser acceptance
        run: python -m unittest discover -s tests -p 'test_canonical_lesson_browser.py' -v
      - name: Test complete lesson 7.1.2 in RU, EN and Chinese
        run: python -m unittest discover -s tests -p 'test_lesson_712_contract.py' -v
      - name: Test complete lesson 7.1.3 in RU, EN and Chinese
        run: python -m unittest discover -s tests -p 'test_lesson_713_contract.py' -v
      - name: Test lesson 8.1.3 ALE, localization, math and Python lab
        run: python -m unittest discover -s tests -p 'test_lesson_813_ale.py' -v
      - name: Check lesson 8.1.3 ALE JavaScript syntax
        run: node --check lessons/data/xai-08-ale.js && node --check scripts/xai-ale-lesson.js
      - name: Test lesson 7.2.3 faithfulness, localization, SVG and Python lab
        run: python -m unittest discover -s tests -p 'test_lesson_723_faithfulness.py' -v
      - name: Check lesson 7.2.3 JavaScript syntax
        run: node --check lessons/data/xai-06-faithfulness.js && node --check scripts/xai-faithfulness-lesson.js
      - name: Check lesson 7.1.2 JavaScript syntax
        run: node --check scripts/main.js && node --check lessons/data/xai-02-local-global.js && node --check scripts/xai-local-global-lesson.js
      - name: Check lesson 7.1.3 JavaScript syntax
        run: node --check lessons/data/xai-03-intrinsic-posthoc.js && node --check scripts/xai-intrinsic-posthoc-lesson.js
      - name: Check lesson 9.1.2 surrogate lesson JavaScript syntax
        run: node --check lessons/data/xai-09-surrogate.js && node --check scripts/xai-surrogate-lesson.js && node --check scripts/lesson-svg-renderer.js
      - name: Test lesson 9.1.3 LIME algorithm, localization and Python lab
        run: python -m unittest discover -s tests -p 'test_lesson_913_lime.py' -v
      - name: Check lesson 9.1.3 JavaScript syntax
        run: node --check lessons/data/xai-09-lime-913.js && node --check scripts/xai-lime-913-lesson.js
      - name: Test lesson 9.2.2 LIME limitations, stability and localization
        run: python -m unittest discover -s tests -p 'test_lesson_922_lime.py' -v
      - name: Check lesson 9.2.2 JavaScript syntax
        run: node --check lessons/data/xai-09-lime-922.js && node --check scripts/xai-lime-922-lesson.js
      - name: Test lesson 9.2.1 LIME neighbourhood, localization and Python lab
        run: python -m unittest discover -s tests -p 'test_lesson_921_lime.py' -v
      - name: Check lesson 9.2.1 JavaScript syntax
        run: node --check lessons/data/xai-09-lime-921.js && node --check scripts/xai-lime-921-lesson.js
      - name: Run catalog unit tests
        run: python -m unittest discover -s tests -p 'test_validate_catalog.py' -v
      - name: Test published lesson 6.1.3, localization, formulas and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_613_production_contract.py' -v
      - name: Test published lesson 6.1.4, localization, decision paths and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_614_production_contract.py' -v
      - name: Test published lesson 1.4.1 in all locales
        run: python -m unittest discover -s tests -p 'test_lesson_141_multilingual.py' -v
      - name: Test lesson 1.5.2 confusion matrix, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_152_contract.py' -v
      - name: Test lesson 1.5.3 classification metrics, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_153_contract.py' -v
      - name: Test lesson 1.5.4 ROC-AUC, PR-AUC, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_154_contract.py' -v
      - name: Test lesson 1.5.6 cross-validation, stability, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_156_contract.py' -v
      - name: Test lesson 1.5.7 regression metrics, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_157_contract.py' -v
      - name: Test lesson 1.5.8 probability calibration, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_158_contract.py' -v
      - name: Test XAI lesson A.1.2.1 — content, SVG, localization and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_xai_0121.py' -v
      - name: Test canonical XAI lesson 4.2.1 and legacy redirect
        run: python -m unittest discover -s tests -p 'test_xai_canonical_lesson.py' -v
      - name: Test full-catalog Track A navigation and unpublished blockers
        run: python -m unittest discover -s tests -p 'test_lesson_navigation_contract.py' -v
      - name: Test v3 catalog identities and legacy compatibility
        run: python -m unittest discover -s tests -p 'test_catalog_v3.py' -v
      - name: Validate catalog and localized URLs
        run: python scripts/validate-catalog.py
      - name: Audit theme-aware SVG text across all lessons
        run: python -m unittest discover -s tests -p 'test_svg_theme_fallback.py' -v
      - name: Validate multilingual lessons and diagram parity
        run: python scripts/validate-multilingual-lessons.py
      - name: Validate A.6 lesson and shared illustrations
        run: python scripts/validate-a6.py
      - name: Enforce canonical public domain and lesson URLs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          domain = "https://dchai.ru"
          assert Path("CNAME").read_text(encoding="utf-8").strip() == "dchai.ru", "CNAME must remain dchai.ru"
          lessons = {
              "lessons/a-9-1-2-les-a-0178.html": "a-9-1-2-les-a-0178.html",
              "lessons/a-9-1-2-les-a-0178-en.html": "a-9-1-2-les-a-0178-en.html",
              "lessons/a-9-1-2-les-a-0178-zh.html": "a-9-1-2-les-a-0178-zh.html",
              "lessons/a-9-2-1-les-a-0180.html": "a-9-2-1-les-a-0180.html",
              "lessons/a-9-2-1-les-a-0180-en.html": "a-9-2-1-les-a-0180-en.html",
              "lessons/a-9-2-1-les-a-0180-zh.html": "a-9-2-1-les-a-0180-zh.html",
          }
          for path, filename in lessons.items():
              html = Path(path).read_text(encoding="utf-8")
              expected = f'{domain}/lessons/{filename}'
              assert f'<link rel="canonical" href="{expected}">' in html, f"Wrong canonical URL in {path}"
              assert "vercel.app" not in html.lower(), f"Vercel URL leaked into {path}"
          print("Canonical domain and RU/EN/ZH lesson URLs verified.")
          PY
  validate-supabase-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dch_school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dch_school_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap isolated Supabase Auth schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dch_school_test -v ON_ERROR_STOP=1 -f supabase/tests/ci_bootstrap.sql
      - name: Apply all Supabase migrations on clean PostgreSQL 16
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -h 127.0.0.1 -U postgres -d dch_school_test -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert RLS, helper functions and public A.1-A.6 metadata
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d dch_school_test -v ON_ERROR_STOP=1 -f supabase/tests/ci_assertions.sql
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [validate, validate-supabase-migrations, validate-catalog]
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Confirm Pages artifact is visible to REST API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' > /tmp/pages-artifact-id && test -s /tmp/pages-artifact-id; then
              echo "Pages artifact is visible: $(cat /tmp/pages-artifact-id)"
              exit 0
            fi
            echo "Waiting for Pages artifact metadata ($attempt/24)"
            sleep 5
          done
          echo "::error::Pages artifact metadata not visible; deployment blocked."
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test the public canonical domain
        env:
          SITE_URL: https://dchai.ru
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          import os

          base = os.environ["SITE_URL"].rstrip("/")
          checks = {
              "/": "AI Research DCH School",
              "/lessons/a-9-1-2-les-a-0178.html": "Локальные суррогатные модели",
              "/lessons/a-9-1-2-les-a-0178-en.html": "Local Surrogate Models",
              "/lessons/a-9-1-2-les-a-0178-zh.html": "局部代理模型",
              "/lessons/a-9-1-3-les-a-0179.html": "Как работает LIME",
              "/lessons/a-9-1-3-les-a-0179-en.html": "How LIME Works",
              "/lessons/a-9-1-3-les-a-0179-zh.html": "LIME 的工作原理",
              "/lessons/a-9-2-1-les-a-0180.html": "Выбор окрестности и интерпретация результатов",
              "/lessons/a-9-2-1-les-a-0180-en.html": "Choosing the Neighbourhood and Interpreting Results",
              "/lessons/a-9-2-1-les-a-0180-zh.html": "邻域选择与结果解读",
          }
          import json
          from pathlib import Path
          catalog = json.loads(Path("data/catalog/catalog-v3.json").read_text(encoding="utf-8"))
          for lesson in catalog["lessons"]:
              if lesson["status"] == lesson.get("content_state") == "published":
                  for locale, route in lesson["url_i18n"].items():
                      checks.setdefault("/" + route, None)
          for path, marker in checks.items():
              last_error = None
              for attempt in range(12):
                  try:
                      request = urllib.request.Request(
                          base + path,
                          headers={"User-Agent": "DCH-School-Public-Release-Smoke-Test/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode("utf-8", errors="replace")
                          if response.status != 200:
                              raise RuntimeError(f"HTTP {response.status}")
                          if marker is not None and marker not in body:
                              raise RuntimeError(f"Expected page marker not found: {marker}")
                          if path.startswith("/lessons/") and "<h1" not in body.lower():
                              raise RuntimeError("Lesson heading missing")
                          if "vercel.app" in body.lower():
                              raise RuntimeError("Vercel URL found in canonical public page")
                      print(f"OK {base + path}")
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 11:
                          raise RuntimeError(f"Public release smoke test failed for {path}: {last_error}")
                      time.sleep(10)
          PY
