name: Supabase migration tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-migration-ci.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-migration-ci.yml"

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dch_school_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dch_school_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dch_school_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Bootstrap Supabase Auth test schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci_bootstrap.sql
      - name: Apply all migrations in order
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Assert schema, RLS and catalog v3 alias integrity
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/ci_assertions.sql -f supabase/tests/catalog_v3_alias_assertions.sql
