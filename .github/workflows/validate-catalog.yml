name: Validate learning catalog

on:
  push:
    branches: ["main"]
    paths:
      - "data/catalog/**"
      - "lessons/data/**"
      - "lessons/practice/**"
      - "lessons/*.html"
      - "lessons/**/*.html"
      - "scripts/lesson-reader.js"
      - "scripts/theme-system.js"
      - "scripts/code-blocks.js"
      - "styles/main.css"
      - "styles/theme-system.css"
      - "styles/code-blocks.css"
      - "docs/roadmap/**"
      - "docs/architecture/**"
      - "docs/design/**"
      - "docs/standards/**"
      - "styles/lesson-reader.css"
      - "scripts/validate-catalog.py"
      - "scripts/validate-multilingual-lessons.py"
      - "tests/**"
      - "requirements-catalog.txt"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "data/catalog/**"
      - "scripts/theme-system.js"
      - "scripts/code-blocks.js"
      - "styles/main.css"
      - "styles/theme-system.css"
      - "styles/code-blocks.css"
      - "docs/roadmap/**"
      - "docs/architecture/**"
      - "docs/design/**"
      - "docs/standards/**"
      - "lessons/data/**"
      - "lessons/practice/**"
      - "lessons/*.html"
      - "lessons/**/*.html"
      - "scripts/lesson-reader.js"
      - "styles/lesson-reader.css"
      - "scripts/validate-catalog.py"
      - "requirements-catalog.txt"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog validator
        run: python -m pip install -r requirements-catalog.txt
      - name: Run catalog validator tests
        run: python -m unittest discover -s tests -p 'test_validate_catalog.py' -v
      - name: Validate legacy production catalog
        run: python scripts/validate-catalog.py
      - name: Test Python catalog compatibility adapter
        run: python -m unittest discover -s tests -p 'test_catalog_compat.py' -v
      - name: Test browser catalog compatibility adapter
        run: node tests/test_catalog_compat_js.cjs
      - name: Test native v3 catalog compatibility reader
        run: node tests/test_catalog_v3_js.cjs
      - name: Test v3 catalog and migration manifest
        run: python -m unittest discover -s tests -p 'test_catalog_v3.py' -v
      - name: Validate staging catalog v3
        run: python scripts/validate-catalog-v3.py
      - name: Test hierarchical catalog UI migration
        run: python -m unittest discover -s tests -p 'test_catalog_ui_v2.py' -v
      - name: Test DCH presentation standards
        run: python -m unittest discover -s tests -p 'test_dch_presentation_standards.py' -v
      - name: Test Python code block presentation
        run: python -m unittest discover -s tests -p 'test_code_presentation.py' -v
      - name: Check theme and code scripts syntax
        run: node --check scripts/theme-system.js && node --check scripts/code-blocks.js
      - name: Check browser catalogue scripts syntax
        run: node --check scripts/catalog-compat.js && node --check scripts/lesson-catalog.js && node --check scripts/planet-map-catalog.js && node --check scripts/home-knowledge-map.js && node --check scripts/lesson-reader.js && node --check lessons/data/xai-01-what-and-why.js
      - name: Validate production hierarchical catalog v2
        run: python scripts/validate-catalog-v2.py
      - name: Validate multilingual lesson pages and diagrams
        run: python scripts/validate-multilingual-lessons.py
