name: Validate learning catalog

on:
  push:
    branches: ["main"]
    paths:
      - "data/catalog/**"
      - "lessons/data/**"
      - "lessons/practice/**"
      - "lessons/*.html"
      - "lessons/**/*.html"
      - "feedback/**"
      - "scripts/main.js"
      - "styles/feedback.css"
      - "styles/lesson-143.css"
      - "scripts/lesson-reader.js"
      - "scripts/planet-map-catalog.js"
      - "styles/knowledge-map.css"
      - "learning-map/**"
      - "docs/education/**"
      - "data/audit-roadmap.json"
      - "scripts/theme-system.js"
      - "scripts/code-blocks.js"
      - "scripts/lesson-layout.js"
      - "styles/lesson-standard.css"
      - "styles/lesson-design-system.css"
      - "styles/lesson-reference-111.css"
      - "styles/lesson-content-components.css"
      - "styles/lesson-design-system.css"
      - "styles/lesson-reference-111.css"
      - "styles/lesson-133.css"
      - "styles/lesson-134.css"
      - "styles/lesson-135.css"
      - "styles/lesson-136.css"
      - "styles/main.css"
      - "styles/theme-system.css"
      - "styles/code-blocks.css"
      - "docs/roadmap/**"
      - "docs/architecture/**"
      - "docs/design/**"
      - "docs/standards/**"
      - "styles/lesson-reader.css"
      - "scripts/validate-catalog.py"
      - "scripts/validate-multilingual-lessons.py"
      - "tests/**"
      - "requirements-catalog.txt"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "styles/lesson-content-components.css"
      - "data/catalog/**"
      - "scripts/theme-system.js"
      - "scripts/code-blocks.js"
      - "scripts/lesson-layout.js"
      - "styles/lesson-standard.css"
      - "styles/lesson-133.css"
      - "styles/lesson-134.css"
      - "styles/lesson-135.css"
      - "styles/main.css"
      - "styles/theme-system.css"
      - "styles/code-blocks.css"
      - "docs/roadmap/**"
      - "docs/architecture/**"
      - "docs/design/**"
      - "docs/standards/**"
      - "lessons/data/**"
      - "lessons/practice/**"
      - "lessons/*.html"
      - "lessons/**/*.html"
      - "scripts/lesson-reader.js"
      - "styles/lesson-reader.css"
      - "scripts/validate-catalog.py"
      - "tests/**"
      - "requirements-catalog.txt"
      - ".github/workflows/validate-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install catalog validator
        run: python -m pip install -r requirements-catalog.txt
      - name: Run catalog validator tests
        run: python -m unittest discover -s tests -p 'test_validate_catalog.py' -v
      - name: Validate legacy production catalog
        run: python scripts/validate-catalog.py
      - name: Test Python catalog compatibility adapter
        run: python -m unittest discover -s tests -p 'test_catalog_compat.py' -v
      - name: Test browser catalog compatibility adapter
        run: node tests/test_catalog_compat_js.cjs
      - name: Test native v3 catalog compatibility reader
        run: node tests/test_catalog_v3_js.cjs
      - name: Test v3 catalog and migration manifest
        run: python -m unittest discover -s tests -p 'test_catalog_v3.py' -v
      - name: Validate staging catalog v3
        run: python scripts/validate-catalog-v3.py
      - name: Test hierarchical catalog UI migration
        run: python -m unittest discover -s tests -p 'test_catalog_ui_v2.py' -v
      - name: Test Track A data lesson pages and localization parity
        run: python -m unittest discover -s tests -p 'test_track_a_data_lessons.py' -v
      - name: Test lesson content, localized diagrams, and source-aligned quizzes
        run: python -m unittest discover -s tests -p 'test_lessons_112_113.py' -v
      - name: Test SVG node label containment
        run: python -m unittest discover -s tests -p 'test_svg_text_fit.py' -v
      - name: Test feedback form pages
        run: python -m unittest discover -s tests -p 'test_feedback_pages.py' -v
      - name: Test lesson 1.4.3 multilingual content, diagrams and assessment
        run: python -m unittest discover -s tests -p 'test_lesson_143_multilingual.py' -v
      - name: Install Playwright Chromium for responsive lesson checks
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Browser check for text overflow in lessons
        run: python -m unittest discover -s tests -p 'test_lesson_layout_overflow.py' -v
      - name: Test locale grid and lesson standard parity
        run: python -m unittest discover -s tests -p 'test_locale_grid_theme_parity.py' -v
      - name: Test lesson design system across Track A
        run: python -m unittest discover -s tests -p 'test_lesson_design_system.py' -v
      - name: Test A.4 glossary and interactive quiz
        run: python -m unittest discover -s tests -p 'test_lesson_a4_interactive_quiz.py' -v
      - name: Test DCH presentation standards
        run: python -m unittest discover -s tests -p 'test_dch_presentation_standards.py' -v
      - name: Test Python code block presentation
        run: python -m unittest discover -s tests -p 'test_code_presentation.py' -v
      - name: Test DCH brand assets
        run: python -m unittest discover -s tests -p 'test_brand_assets.py' -v
      - name: Check theme and code scripts syntax
        run: node --check scripts/main.js && node --check scripts/theme-system.js && node --check scripts/code-blocks.js && node --check scripts/lesson-layout.js
      - name: Check browser catalogue scripts syntax
        run: node --check scripts/catalog-compat.js && node --check scripts/lesson-catalog.js && node --check scripts/planet-map-catalog.js && node --check scripts/home-knowledge-map.js && node --check scripts/lesson-reader.js && node --check lessons/data/xai-01-what-and-why.js
      - name: Validate production hierarchical catalog v2
        run: python scripts/validate-catalog-v2.py
      - name: Test lesson 1.3.2 multilingual diagrams, themes, and mobile layout
        run: python -m unittest discover -s tests -p 'test_lesson_132_multilingual.py' -v
      - name: Test lesson 1.3.3 reinforcement learning publication and localization
        run: python -m unittest discover -s tests -p 'test_lesson_133_multilingual.py' -v
      - name: Test lesson 1.3.4 classification and regression publication
        run: python -m unittest discover -s tests -p 'test_lesson_134_multilingual.py' -v
      - name: Test lesson 1.3.5 clustering and dimensionality reduction
        run: python -m unittest discover -s tests -p 'test_lesson_135_multilingual.py' -v
      - name: Test lesson 1.3.6 generative models and multilingual parity
        run: python -m unittest discover -s tests -p 'test_lesson_136_multilingual.py' -v
      - name: Test sequential lesson navigation and concept emphasis
        run: python -m unittest discover -s tests -p 'test_lesson_navigation_and_concepts.py' -v
      - name: Test interactive DCH knowledge map and localized navigation
        run: python -m unittest discover -s tests -p 'test_knowledge_map.py' -v
      - name: Validate multilingual lesson pages and diagrams
        run: python scripts/validate-multilingual-lessons.py
