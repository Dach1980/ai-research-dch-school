<head>

<meta name="theme-color" content="#080d1b"><meta name="description" content="对课程有疑问、发现错误，或希望提出网站改进建议？欢迎给我们留言。您的反馈将帮助我们持续完善学校。">
<title>问题与建议 · AI Research DCH School</title>
<link rel="icon" href="../assets/favicon.svg"><link rel="stylesheet" href="../styles/main.css"><link rel="stylesheet" href="../styles/account.css"><link rel="stylesheet" href="../styles/feedback.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="../index-zh.html"><img src="../assets/logo.svg" alt="DCH"></a>
<button class="menu-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
<nav class="nav"><a href="../index-zh.html">首页</a><a href="../lessons/index-zh.html">课程</a><a href="../learning-map/index-zh.html">知识地图</a></nav>
</header>
<main class="feedback-page">
<a class="feedback-back" href="../index-zh.html">← 返回首页</a>
<section class="feedback-card">
<p class="eyebrow">AI RESEARCH DCH SCHOOL · 反馈</p>
<h1>问题与建议</h1>
<p class="feedback-intro">对课程有疑问、发现错误，或希望提出网站改进建议？欢迎给我们留言。您的反馈将帮助我们持续完善学校。</p>
<form class="feedback-form" id="feedback-form" data-busy="发送中…" data-success="留言已保存。编号：" data-rate="请求过多，请稍后重试。" data-error="无法确认留言是否保存。请检查内容或稍后重试。重复提交可能产生重复记录。" method="post" action="/api/feedback">
<input type="text" name="website" hidden tabindex="-1" autocomplete="off">
<noscript>提交留言需要启用 JavaScript。</noscript>
<label>反馈主题<select name="kind" required><option value="question">网站或课程问题</option><option value="suggestion">建议或想法</option><option value="bug">报告问题或错误</option><option value="content">课程内容反馈</option></select></label>
<label>您的姓名（选填）<input name="name" type="text" maxlength="100" autocomplete="name"></label>
<label>回复邮箱（选填）<input name="replyEmail" type="email" maxlength="254" autocomplete="email"></label>
<label>相关页面（选填）<input name="pageUrl" id="feedback-page-url" type="url" maxlength="1000" placeholder="https://dchai.ru/..."></label>
<label>留言内容<textarea name="message" required minlength="10" maxlength="3000"></textarea><span class="hint">请勿填写密码、支付信息或其他机密信息。</span></label>
<label class="feedback-consent"><span><input type="checkbox" name="consent" value="yes" required style="width:auto"> 我自愿同意按照单独的同意声明处理我的反馈数据。</span> <a href="../legal/feedback-consent.html">同意声明</a></label>
<div class="feedback-actions"><button class="feedback-submit" type="submit" disabled>发送</button></div>
<p class="feedback-notice" id="feedback-notice" role="status" aria-live="polite" hidden></p>
</form>
<div class="feedback-privacy">留言保存在学校服务器，并通过 Mail.ru 通知管理员。姓名和邮箱为选填项。请勿填写机密信息。 <a href="../legal/privacy.html">隐私政策</a></div>
</section>
</main>
<footer class="feedback-footer">© 2026 AI Research DCH School · <a href="../index-zh.html">首页</a></footer>
<script src="../scripts/main.js"></script>
<script src="../scripts/language-switcher.js"></script>
<script src="../scripts/theme-system.js" defer></script>
<script src="../scripts/feedback-api.js" defer></script>
</body></html>
